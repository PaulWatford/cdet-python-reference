[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdet-reference"
version = "0.1.0"
description = "Verified small-cluster reference implementation of the Rossi 2017 connected-determinant algorithm for Hubbard models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = [
    "connected-determinant",
    "fermionic-perturbation-theory",
    "hubbard-model",
    "many-body-physics",
    "diagrammatic-monte-carlo",
    "exact-diagonalization",
    "condensed-matter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "mpmath>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
notebook = ["jupyter>=1.0", "ipykernel>=6.0"]

[project.urls]
# Fill these in once your GitHub username and repo URL are set:
Homepage = "https://github.com/PaulWatford/cdet-python-reference"
Repository = "https://github.com/PaulWatford/cdet-python-reference"
Issues = "https://github.com/PaulWatford/cdet-python-reference/issues"

[tool.setuptools.packages.find]
include = ["cdet_reference*"]
